name: 编译 ImmortalWrt 固件

on:
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: '1. 选择要编译的 ImmortalWrt 版本'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - master
          - openwrt-24.10
          - openwrt-23.05
          - openwrt-21.02
      config_file:
        description: '2. 输入 .config 文件在仓库中的完整路径'
        required: true
        default: 'config/immortalwrt/ea0326/mini.config'
        type: string
      ssh:
        description: '3. (可选) 在编译前进入 SSH 调试'
        required: false
        default: 'false'

# 注意：这里不再定义依赖 github.event 的 env！

jobs:
  check:
    name: 🔬 版本与配置审核 (${{ github.event.inputs.immortalwrt_version }})
    runs-on: ubuntu-22.04
    env:
      REPO_URL: https://github.com/immortalwrt/immortalwrt.git
      REPO_BRANCH: ${{ github.event.inputs.immortalwrt_version }}
      CONFIG_FILE: ${{ github.event.inputs.config_file }}
      DIY_P1_SH: config/immortalwrt/DIY-1.sh
      DIY_P2_SH: config/immortalwrt/DIY-2.sh
      TZ: Asia/Shanghai
    # ... rest of steps ...

  build:
    name: 🛠️ 编译固件 (${{ github.event.inputs.immortalwrt_version }})
    runs-on: ubuntu-22.04
    needs: check
    timeout-minutes: 360
    env:
      REPO_URL: https://github.com/immortalwrt/immortalwrt.git
      REPO_BRANCH: ${{ github.event.inputs.immortalwrt_version }}
      CONFIG_FILE: ${{ github.event.inputs.config_file }}
      DIY_P1_SH: config/immortalwrt/DIY-1.sh
      DIY_P2_SH: config/immortalwrt/DIY-2.sh
      UPLOAD_RELEASE: 'true'
      TZ: Asia/Shanghai
    # ... rest of steps ...

  publish:
    name: 🚀 发布固件 (${{ github.event.inputs.immortalwrt_version }})
    runs-on: ubuntu-22.04
    needs: [check, build]
    permissions:
      contents: write
    env:
      REPO_BRANCH: ${{ github.event.inputs.immortalwrt_version }}
      UPLOAD_RELEASE: 'true'
    # ... rest of steps ...
