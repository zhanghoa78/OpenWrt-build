# .github/workflows/debug-generate-config.yml
name: '[Debug] 生成新的 .config 文件 (公开会话)'

on:
  workflow_dispatch: # 手动触发

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  generate-config:
    runs-on: ubuntu-22.04
    name: 通过 SSH 交互式生成配置文件

    steps:
      - name: 1. 检出仓库代码 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 清理磁盘空间 (Free Up Disk Space)
        run: |
          echo "Starting disk cleanup..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "Disk space after cleanup:"
          df -h

      - name: 3. 安装编译依赖 (Install Dependencies)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev \
            python3-distutils python3-dev python3-pip \
            rsync subversion sudo unzip wget xz-utils zlib1g-dev
          sudo timedatectl set-timezone "$TZ"

      - name: 4. 克隆 ImmortalWrt 源码 (Clone Source Code)
        run: |
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          
      - name: 5. 更新并安装 Feeds (Update & Install Feeds)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ Feeds are ready. Waiting for SSH connection..."

      # --- 主要修改点在这里 ---
      - name: 6. 开启公开 SSH 会话进行交互式配置
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30 # SSH 会话最多保持 30 分钟
        with:
          # 将此项设置为 false，允许任何人通过链接访问
          limit-access-to-actor: false 

      - name: 7. 生成并备份 .config 文件 (Generate and Backup .config)
        id: generate_config
        run: |
          cd openwrt
          if [ ! -f .config ]; then
            echo "::warning::.config file not found. This means you did not save your configuration in the SSH session."
            echo "::warning::Skipping config generation."
            echo "config_generated=false" >> $GITHUB_OUTPUT
          else
            echo "Found .config file. Generating a minimal version for backup..."
            ./scripts/diffconfig.sh > ../new-mini.config
            cp .config ../full.config
            echo "✅ Minimal config saved to 'new-mini.config'"
            echo "✅ Full config saved to 'full.config'"
            echo "config_generated=true" >> $GITHUB_OUTPUT
            echo "MINI_CONFIG_NAME=immortalwrt-config-${{ env.REPO_BRANCH }}-${{ github.run_id }}" >> $GITHUB_ENV
          fi

      - name: 8. 上传新的配置文件 (Upload Config Files as Artifact)
        if: steps.generate_config.outputs.config_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MINI_CONFIG_NAME }}
          path: |
            new-mini.config
            full.config
          if-no-files-found: error
