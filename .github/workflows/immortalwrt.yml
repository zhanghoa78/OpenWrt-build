name: EA0326 编译官方 ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '启用 SSH 调试 (true/false)'
        required: false
        default: 'false'
      # --- 新增选项 ---
      skip_build_and_test_upload:
        description: '跳过编译并创建假文件来测试上传? (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: config/immortalwrt/ea0326/mini.config
  DIY_P1_SH: config/immortalwrt/ea0326/DIY-1.sh
  DIY_P2_SH: config/immortalwrt/ea0326/DIY-2.sh
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_RELEASE: 'true'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 授予 'GITHUB_TOKEN' 写入权限，以允许创建 Release
      actions: write  # 授予 'GITHUB_TOKEN' 写入权限，以允许清理旧的 Actions runs

    timeout-minutes: 360

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 快速清理磁盘空间
        run: |
          echo "Starting fast disk cleanup..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "Disk space after cleanup:"
          df -h

      - name: 显示系统信息
        run: |
          echo "=== CPU ==="; lscpu | grep "Model name"
          echo "=== Memory ==="; free -h
          echo "=== Disk (清理后) ==="; df -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev \
            python3-distutils python3-dev python3-pip \
            rsync subversion sudo unzip wget xz-utils zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir

      - name: 配置 ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 10.0G" > ~/.ccache/ccache.conf

      - name: 缓存 ccache 数据
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles(env.CONFIG_FILE, env.DIY_P1_SH, env.DIY_P2_SH) }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 克隆官方 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: 缓存 OpenWrt dl 目录
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-immortalwrt-dl-${{ hashFiles(env.CONFIG_FILE) }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-

      - name: F (P1) - 添加自定义源或软件包
        run: |
          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            cd openwrt
            set -e
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
            set +e
          fi

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # --- 关键修改点：SSH 步骤被移动到了这里 ---
      - name: 设置 SSH 调试 (可选)
        if: github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: 应用自定义配置并推断路径 (已修正)
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        id: apply_config
        run: |
          # 1. 应用自定义文件
          if [ -d "files" ]; then
            cp -r files openwrt/
          fi
          
          # 2. 检查并应用 .config 文件
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error file=$CONFIG_FILE::Custom config file not found!"
            exit 1
          fi
          cp "$CONFIG_FILE" openwrt/.config
          echo "Loaded custom config: $CONFIG_FILE"
          
          # 3. 立即推断路径 (修正后的逻辑)
          cd openwrt
          
          TARGET_SUBDIR=""
          
          # 优先方案：从设备定义中精确推断 (更可靠)
          # 例如从 "CONFIG_TARGET_mediatek_filogic_DEVICE_nokia_ea0326gmp=y"
          # 提取出 "mediatek/filogic"
          DEVICE_CONFIG_LINE=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config)
          if [ -n "$DEVICE_CONFIG_LINE" ]; then
            TARGET_STR=$(echo "$DEVICE_CONFIG_LINE" | sed -r 's/CONFIG_TARGET_(.*)_DEVICE_.*/\1/')
            TARGET_SUBDIR=$(echo "$TARGET_STR" | tr '_' '/')
            echo "Successfully deduced TARGET_SUBDIR='$TARGET_SUBDIR' from device line."
          fi
          # 备用方案：如果上述方法失败，则退回检查子目标行
          if [ -z "$TARGET_SUBDIR" ]; then
            echo "::warning::Could not deduce from DEVICE line. Falling back to checking subtarget line..."
            if grep -q '^CONFIG_TARGET_mediatek_filogic=y' .config; then
              TARGET_SUBDIR="mediatek/filogic"
              echo "Deduced TARGET_SUBDIR='$TARGET_SUBDIR' from subtarget line."
            else
              echo "::error::Failed to deduce TARGET_SUBDIR from your config file."
              echo "::error::Please ensure your config file contains a valid target and device selection for the mediatek/filogic platform."
              exit 1
            fi
          fi
          
          echo "Final deduced TARGET_SUBDIR=$TARGET_SUBDIR"
          echo "DEVICE_SUBDIR=$TARGET_SUBDIR" >> $GITHUB_ENV # 保存到全局变量
          # 提取设备名称以供后续验证
          DEVICE_NAME=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')
          if [ -z "$DEVICE_NAME" ]; then
            echo "::error::Could not find a 'CONFIG_TARGET_..._DEVICE_...=y' line in $CONFIG_FILE."
            exit 1
          fi
          echo "Deduced DEVICE_NAME=$DEVICE_NAME"
          echo "DEVICE_NAME_FOR_VERIFY=$DEVICE_NAME" >> $GITHUB_ENV # 保存设备名称
          
          echo "status=success" >> $GITHUB_OUTPUT
      - name: 运行 DIY 脚本 (P2) - 配置后调整
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            cd openwrt
            set -e
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
            set +e
          fi

      - name: 在 .config 中启用 ccache
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          cd openwrt
          echo "CONFIG_CCACHE=y" >> .config

      - name: 下载软件包源码 (并更新 .config)
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          cd openwrt
          if [ ! -f .config ]; then
            echo "::error::.config not found before 'make download'!"
            exit 1
          fi

          # 'make oldconfig' 会以非交互方式更新 .config，修复不兼容的设置
          yes "" | make oldconfig
          
          make download -j8
          find dl -name "*.badcheck" -delete

      - name: 验证 .config (在 oldconfig 之后)
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          cd openwrt
          echo "Verifying .config after 'make oldconfig'..."
          echo "Checking for device: ${{ env.DEVICE_NAME_FOR_VERIFY }}"
          
          # 检查设备选择行是否仍然存在
          DEVICE_LINE_PRESENT=$(grep "^CONFIG_TARGET_.*_DEVICE_${{ env.DEVICE_NAME_FOR_VERIFY }}=y" .config || echo "")
          
          if [ -z "$DEVICE_LINE_PRESENT" ]; then
            echo "::error::Build configuration error!"
            echo "::error::'make oldconfig' command (in '下载软件包源码' step) has removed your device selection (DEVICE_${{ env.DEVICE_NAME_FOR_VERIFY }}) from .config."
            echo "::error::This almost always means your 'mini.config' file is incompatible with the '$REPO_BRANCH' branch."
            echo "::error::Common reasons:"
            echo "::error::1. The device '${{ env.DEVICE_NAME_FOR_VERIFY }}' no longer exists or was renamed in this branch."
            echo "::error::2. Your 'mini.config' is missing other critical dependencies that 'make oldconfig' could not resolve."
            echo "::error::Please update your 'config/immortalwrt/ea0326/mini.config' file to be compatible with the source."
            
            echo "--- DUMPING .config diff ---"
            echo "This shows what 'make oldconfig' changed/removed from your original config:"
            # 比较原始文件和被 'make oldconfig' 修改后的文件
            diff $GITHUB_WORKSPACE/$CONFIG_FILE .config || echo "Diff complete."
            echo "--- END .config diff ---"
            exit 1
          else
            echo "Config verification passed. Device selection ($DEVICE_LINE_PRESENT) is still present."
          fi

      - name: 编译固件
        if: github.event.inputs.skip_build_and_test_upload == 'false' && steps.apply_config.outputs.status == 'success'
        id: compile
        run: |
          cd openwrt
          echo "Building with $(($(nproc) + 1)) threads..."
          if make -j$(($(nproc) + 1)); then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
            echo "FILE_TIME=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
            echo "TAG_TIME=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
          else
            echo "::warning::Parallel build failed, trying single thread with verbose output..."
            if make -j1 V=s; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
              echo "FILE_TIME=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
              echo "TAG_TIME=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
            else
              echo "::error::Build failed even with single thread"
              exit 1
            fi
          fi

      - name: 整理固件文件 (为 Release 准备)
        if: github.event.inputs.skip_build_and_test_upload == 'false' && steps.compile.outputs.status == 'success'
        run: |
          FIRMWARE_DIR="openwrt/bin/targets/$DEVICE_SUBDIR"
          if [ ! -d "$FIRMWARE_DIR" ]; then
            echo "::error::Firmware directory not found: $FIRMWARE_DIR"
            echo "::error::Build seemed to succeed, but the output directory is missing."
            echo "::error::This confirms the build did not actually produce any images, likely due to the .config issue."
            exit 1
          fi
          
          # 检查是否生成了实际的固件文件
          if ! ls "$FIRMWARE_DIR"/*.bin >/dev/null 2>&1 && ! ls "$FIRMWARE_DIR"/*.itb >/dev/null 2>&1; then
            echo "::error::No firmware files (*.bin or *.itb) found in $FIRMWARE_DIR"
            echo "::error::Generated files:"
            ls -la "$FIRMWARE_DIR" || true
            exit 1
          fi
          
          echo "FIRMWARE=$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "Found firmware files:"
          ls -1 "$FIRMWARE_DIR"/*.bin "$FIRMWARE_DIR"/*.itb 2>/dev/null || echo "No bin/itb files (checking other patterns)"
          ls -1 "$FIRMWARE_DIR"/

      - name: 设置测试上传 (跳过编译)
        if: github.event.inputs.skip_build_and_test_upload == 'true'
        id: test_setup # 给予一个 ID
        run: |
          echo "::warning::Setting up dummy files for upload test..."
          
          TARGET_SUBDIR=""
          CONFIG_PATH="${{ env.CONFIG_FILE }}"
          
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "::warning::Config file not found at: $CONFIG_PATH. (This is OK in test mode)"
            TARGET_SUBDIR="mediatek/filogic_test_fallback_notfound"
            echo "::warning::Falling back to dummy subdir: $TARGET_SUBDIR"
          
          # 更新这里：使用正确的 mediatek_filogic 模式
          elif grep -q '^CONFIG_TARGET_mediatek_filogic=y' "$CONFIG_PATH"; then
            TARGET_SUBDIR="mediatek/filogic"
            echo "::warning::Test mode: Successfully deduced TARGET_SUBDIR=$TARGET_SUBDIR from config file."
          
          else
            echo "::warning::File found at $CONFIG_PATH, but could not find '^CONFIG_TARGET_mediatek_filogic=y' in it."
            TARGET_SUBDIR="mediatek/filogic_test_fallback_grepfailed"
            echo "::warning::Falling back to dummy subdir: $TARGET_SUBDIR"
          fi
          
          FIRMWARE_DIR="openwrt/bin/targets/$TARGET_SUBDIR"
          mkdir -p $FIRMWARE_DIR
          # 创建所有需要的测试文件
          echo "This is a dummy file for testing." > $FIRMWARE_DIR/immortalwrt-mediatek-filogic-nokia_ea0326gmp-initramfs-recovery.itb
          echo "This is a dummy file for testing." > $FIRMWARE_DIR/immortalwrt-mediatek-filogic-nokia_ea0326gmp-squashfs-factory.bin
          echo "This is a dummy file for testing." > $FIRMWARE_DIR/immortalwrt-mediatek-filogic-nokia_ea0326gmp-squashfs-sysupgrade.bin
          echo "dummy_sha256sum TEST-factory.bin" > $FIRMWARE_DIR/sha256sums
          
          echo "FIRMWARE=$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT # 触发上传
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "FILE_TIME=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
          echo "TAG_TIME=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      - name: 上传固件到 Artifacts (容错版)
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Official-ImmortalWrt-EA0326${{ env.FILE_DATE }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/*.fip
            ${{ env.FIRMWARE }}/sha256sums
          if-no-files-found: warn
          retention-days: 7

      - name: 准备 Release 说明
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_RELEASE == 'true'
        run: |
          echo "Official ImmortalWrt for Redmi EA0326" > release.txt
          echo "Branch: ${{ env.REPO_BRANCH }}" >> release.txt
          echo "默认IP：192.168.2.223" >> release.txt
          echo "默认密码：password（首次登录请设置）" >> release.txt
          echo "✅ 支持 IPv6、SQM、Docker（可选）、AdGuard Home（可选）" >> release.txt
          echo "构建时间：${{ env.FILE_TIME }}" >> release.txt
          if [ "${{ github.event.inputs.skip_build_and_test_upload }}" == "true" ]; then
            echo "--- (这是一个测试 Release) ---" >> release.txt
          fi
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 准备 Release 文件列表
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_RELEASE == 'true'
        id: prepare_release_files
        run: |
          echo "扫描固件目录中的文件..."
          FIRMWARE_DIR="${{ env.FIRMWARE }}"
          
          # 查找所有可能的固件文件
          FOUND_FILES=()
          for pattern in "*.fip" "*.itb" "*.bin" "sha256sums"; do
            for file in "$FIRMWARE_DIR"/$pattern; do
              if [ -f "$file" ]; then
                FOUND_FILES+=("$file")
                echo "找到文件: $(basename "$file")"
              fi
            done
          done
          
          if [ ${#FOUND_FILES[@]} -eq 0 ]; then
            echo "::warning::未找到任何固件文件"
            echo "files_exist=false" >> $GITHUB_OUTPUT
          else
            echo "files_exist=true" >> $GITHUB_OUTPUT
            # 创建文件列表供后续步骤使用
            printf "%s\n" "${FOUND_FILES[@]}" > filelist.txt
          fi

      - name: 创建 GitHub Release
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@master
        with:
          name: ${{ env.FILE_TIME }} - 基础版
          tag_name: v${{ env.TAG_TIME }}
          body_path: release.txt
          # 不在这里添加文件，避免因文件缺失导致创建失败
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: 批量上传文件到 Release (容错)
        if: steps.prepare_release_files.outputs.files_exist == 'true' && env.UPLOAD_RELEASE == 'true'
        run: |
          echo "开始批量上传文件到 Release..."
          
          if [ ! -f filelist.txt ]; then
            echo "::warning::文件列表不存在"
            exit 0
          fi
          
          RELEASE_TAG="v${{ env.TAG_TIME }}"
          UPLOAD_SUCCESS=0
          UPLOAD_TOTAL=0
          
          while IFS= read -r filepath; do
            if [ -f "$filepath" ]; then
              ((UPLOAD_TOTAL++))
              filename=$(basename "$filepath")
              echo "正在上传: $filename"
              
              # 使用 curl 上传，每个文件独立处理
              if curl -f -s -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
                 -H "Content-Type: application/octet-stream" \
                 --data-binary @"$filepath" \
                 "https://uploads.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG/assets?name=$filename" > /dev/null; then
                echo "✅ 上传成功: $filename"
                ((UPLOAD_SUCCESS++))
              else
                echo "::warning::上传失败: $filename (文件可能已存在或其他错误)"
              fi
            fi
          done < filelist.txt
          
          echo "上传完成: $UPLOAD_SUCCESS/$UPLOAD_TOTAL 个文件成功上传"
          if [ $UPLOAD_SUCCESS -eq 0 ]; then
            echo "::warning::没有文件被成功上传，但 Release 已创建"
          fi

      - name: 清理旧的 Workflow 运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 2
          keep_minimum_runs: 3

      - name: 删除旧的 Release (保留最近10个)
        if: env.UPLOAD_RELEASE == 'true' && (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success')
        uses: dev-drprasad/delete-older-releases@v0.3.1
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
