name: EA0326 编译官方 ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '启用 SSH 调试 (true/false)'
        required: false
        default: 'false'
      skip_build_and_test_upload:
        description: '跳过编译并创建假文件来测试上传? (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: config/immortalwrt/ea0326/mini.config
  DIY_P1_SH: config/immortalwrt/ea0326/DIY-1.sh
  DIY_P2_SH: config/immortalwrt/ea0326/DIY-2.sh
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_RELEASE: 'true'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 授予 'GITHUB_TOKEN' 写入权限, 以允许创建 Release 和上传附件
      actions: write  # 授予 'GITHUB_TOKEN' 写入权限, 以允许清理旧的 Actions runs

    timeout-minutes: 360

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 快速清理磁盘空间
        run: |
          echo "Starting fast disk cleanup..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "Disk space after cleanup:"
          df -h

      - name: 显示系统信息
        run: |
          echo "=== CPU ==="; lscpu | grep "Model name"
          echo "=== Memory ==="; free -h
          echo "=== Disk (清理后) ==="; df -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev \
            libncurses5-dev libncursesw5-dev libssl-dev \
            python3-distutils python3-dev python3-pip \
            rsync subversion sudo unzip wget xz-utils zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir

      - name: 配置 ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 10.0G" > ~/.ccache/ccache.conf

      - name: 缓存 ccache 数据
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles(env.CONFIG_FILE, env.DIY_P1_SH, env.DIY_P2_SH) }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 克隆官方 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: 缓存 OpenWrt dl 目录
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-immortalwrt-dl-${{ hashFiles(env.CONFIG_FILE) }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-

      - name: F (P1) - 添加自定义源或软件包
        run: |
          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            cd openwrt
            set -e
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
            set +e
          fi

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 设置 SSH 调试 (可选)
        if: github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: 应用自定义配置并推断路径
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        id: apply_config
        run: |
          if [ -d "files" ]; then cp -r files openwrt/; fi
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error file=$CONFIG_FILE::Custom config file not found!"
            exit 1
          fi
          cp "$CONFIG_FILE" openwrt/.config
          echo "Loaded custom config: $CONFIG_FILE"
          
          cd openwrt
          DEVICE_CONFIG_LINE=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config)
          if [ -n "$DEVICE_CONFIG_LINE" ]; then
            TARGET_STR=$(echo "$DEVICE_CONFIG_LINE" | sed -r 's/CONFIG_TARGET_(.*)_DEVICE_.*/\1/')
            TARGET_SUBDIR=$(echo "$TARGET_STR" | tr '_' '/')
            echo "Successfully deduced TARGET_SUBDIR='$TARGET_SUBDIR' from device line."
          else
            echo "::error::Failed to deduce TARGET_SUBDIR from your config file."
            exit 1
          fi
          
          echo "DEVICE_SUBDIR=$TARGET_SUBDIR" >> $GITHUB_ENV
          DEVICE_NAME=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')
          if [ -z "$DEVICE_NAME" ]; then
            echo "::error::Could not find a 'CONFIG_TARGET_..._DEVICE_...=y' line in $CONFIG_FILE."
            exit 1
          fi
          echo "DEVICE_NAME_FOR_VERIFY=$DEVICE_NAME" >> $GITHUB_ENV
          
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 运行 DIY 脚本 (P2) - 配置后调整
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            cd openwrt
            set -e
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
            set +e
          fi

      - name: 在 .config 中启用 ccache
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          cd openwrt
          echo "CONFIG_CCACHE=y" >> .config

      - name: 下载软件包源码 (并更新 .config)
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          cd openwrt
          if [ ! -f .config ]; then
            echo "::error::.config not found before 'make download'!"
            exit 1
          fi
          yes "" | make oldconfig
          make download -j8
          find dl -name "*.badcheck" -delete

      - name: 验证 .config (在 oldconfig 之后)
        if: github.event.inputs.skip_build_and_test_upload == 'false'
        run: |
          cd openwrt
          DEVICE_LINE_PRESENT=$(grep "^CONFIG_TARGET_.*_DEVICE_${{ env.DEVICE_NAME_FOR_VERIFY }}=y" .config || echo "")
          if [ -z "$DEVICE_LINE_PRESENT" ]; then
            echo "::error::Build configuration error! 'make oldconfig' has removed your device selection from .config."
            echo "::error::This means your 'mini.config' is incompatible with the '$REPO_BRANCH' branch."
            echo "--- DUMPING .config diff ---"
            diff $GITHUB_WORKSPACE/$CONFIG_FILE .config || echo "Diff complete."
            exit 1
          else
            echo "Config verification passed. Device selection is still present."
          fi

      - name: 编译固件
        if: github.event.inputs.skip_build_and_test_upload == 'false' && steps.apply_config.outputs.status == 'success'
        id: compile
        run: |
          cd openwrt
          echo "Building with $(($(nproc) + 1)) threads..."
          if make -j$(($(nproc) + 1)); then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "::warning::Parallel build failed, trying single thread with verbose output..."
            if make -j1 V=s; then
              echo "status=success" >> $GITHUB_OUTPUT
            else
              echo "::error::Build failed even with single thread"
              exit 1
            fi
          fi
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "FILE_TIME=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
          echo "TAG_TIME=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      - name: 整理固件文件 (为 Release 准备)
        if: github.event.inputs.skip_build_and_test_upload == 'false' && steps.compile.outputs.status == 'success'
        run: |
          FIRMWARE_DIR="openwrt/bin/targets/$DEVICE_SUBDIR"
          if [ ! -d "$FIRMWARE_DIR" ] || ! ls "$FIRMWARE_DIR"/*.bin >/dev/null 2>&1 && ! ls "$FIRMWARE_DIR"/*.itb >/dev/null 2>&1; then
            echo "::error::No firmware files (*.bin or *.itb) found in $FIRMWARE_DIR"
            ls -la "$FIRMWARE_DIR" || true
            exit 1
          fi
          echo "FIRMWARE=$FIRMWARE_DIR" >> $GITHUB_ENV

      - name: 设置测试上传 (跳过编译)
        if: github.event.inputs.skip_build_and_test_upload == 'true'
        id: test_setup
        run: |
          echo "::warning::Setting up dummy files for upload test..."
          FIRMWARE_DIR="openwrt/bin/targets/mediatek/filogic"
          mkdir -p $FIRMWARE_DIR
          echo "dummy" > $FIRMWARE_DIR/immortalwrt-mediatek-filogic-nokia_ea0326gmp-initramfs-recovery.itb
          echo "dummy" > $FIRMWARE_DIR/immortalwrt-mediatek-filogic-nokia_ea0326gmp-squashfs-factory.bin
          echo "dummy" > $FIRMWARE_DIR/immortalwrt-mediatek-filogic-nokia_ea0326gmp-squashfs-sysupgrade.bin
          echo "dummy" > $FIRMWARE_DIR/sha256sums
          
          echo "FIRMWARE=$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "FILE_TIME=$(date "+%Y年%m月%d日")" >> $GITHUB_ENV
          echo "TAG_TIME=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      - name: 上传固件到 Artifacts
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Official-ImmortalWrt-EA0326${{ env.FILE_DATE }}
          path: |
            ${{ env.FIRMWARE }}/*.bin
            ${{ env.FIRMWARE }}/*.itb
            ${{ env.FIRMWARE }}/sha256sums
          if-no-files-found: warn
          retention-days: 7

      - name: 准备 Release 说明
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_RELEASE == 'true'
        run: |
          cat <<EOF >release.txt
          Official ImmortalWrt for Redmi EA0326
          Branch: ${{ env.REPO_BRANCH }}
          默认IP：192.168.2.223
          默认密码：password（首次登录请设置）
          ✅ 支持 IPv6、SQM、Docker（可选）、AdGuard Home（可选）
          构建时间：${{ env.FILE_TIME }}
          ${{ github.event.inputs.skip_build_and_test_upload == 'true' && '--- (这是一个测试 Release) ---' || '' }}
          EOF

      - name: 准备 Release 文件列表
        if: (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success') && env.UPLOAD_RELEASE == 'true'
        id: prepare_release_files
        run: |
          FIRMWARE_DIR="${{ env.FIRMWARE }}"
          find "$FIRMWARE_DIR" -type f \( -name "*.bin" -o -name "*.itb" -o -name "sha256sums" \) > filelist.txt
          if [ ! -s filelist.txt ]; then
            echo "::warning::未找到任何固件文件用于 Release"
            echo "files_exist=false" >> $GITHUB_OUTPUT
          else
            echo "找到以下文件准备上传:"
            cat filelist.txt
            echo "files_exist=true" >> $GITHUB_OUTPUT
          fi

      - name: 创建 GitHub Release
        if: steps.prepare_release_files.outputs.files_exist == 'true' && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2 # <-- 使用稳定版本 @v2
        with:
          name: ${{ env.FILE_TIME }} - 基础版
          tag_name: v${{ env.TAG_TIME }}
          body_path: release.txt
          # 不在这里上传文件, 分离关注点
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <-- 确保使用自动生成的 GITHUB_TOKEN

      # --- 关键修复：使用正确的 API 地址和认证 ---
      - name: 批量上传文件到 Release
        if: steps.prepare_release_files.outputs.files_exist == 'true' && env.UPLOAD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <-- 将 Token 传递到脚本环境
        run: |
          echo "开始批量上传文件到 Release..."
          RELEASE_TAG="v${{ env.TAG_TIME }}"
          
          # 1. 获取 Release 的 upload_url, 这是上传文件的正确端点
          UPLOAD_URL_JSON=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG")
          
          UPLOAD_URL=$(echo "$UPLOAD_URL_JSON" | jq -r .upload_url)
          
          # 检查是否成功获取
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" == "null" ]; then
            echo "::error::无法获取 Release 的 upload_url。可能是 Release 创建失败或 API 访问受限。"
            echo "API Response: $UPLOAD_URL_JSON"
            exit 1
          fi
          
          # upload_url 包含一个模板 {?name,label}, 我们需要把它去掉
          UPLOAD_URL_CLEAN=$(echo "$UPLOAD_URL" | sed 's/{?name,label}//')
          
          echo "使用 Release Tag: $RELEASE_TAG"
          echo "上传端点: $UPLOAD_URL_CLEAN"
          
          UPLOAD_SUCCESS=0
          UPLOAD_TOTAL=$(wc -l < filelist.txt)
          
          while IFS= read -r filepath; do
            filename=$(basename "$filepath")
            echo ">>> 正在上传: $filename"
            
            # 2. 向正确的 upload_url 上传
            response_code=$(curl -s -o /dev/null -w "%{http_code}" \
             -H "Authorization: token $GITHUB_TOKEN" \
             -H "Content-Type: application/octet-stream" \
             --data-binary @"$filepath" \
             "$UPLOAD_URL_CLEAN?name=$filename")
            
            if [ "$response_code" -eq 201 ]; then
              echo "✅ 上传成功: $filename"
              ((UPLOAD_SUCCESS++))
            else
              echo "::warning::上传失败: $filename (HTTP Status: $response_code)"
            fi
            sleep 1 # 短暂暂停避免 API 频率限制
          done < filelist.txt
          
          echo "---"
          echo "上传汇总: $UPLOAD_SUCCESS/$UPLOAD_TOTAL 个文件成功上传。"
          if [ "$UPLOAD_SUCCESS" -lt "$UPLOAD_TOTAL" ]; then
             echo "::warning::部分文件上传失败，请检查 Release 页面。"
          fi
          
      - name: 清理旧的 Workflow 运行记录
        uses: Mattraks/delete-workflow-runs@v2
        if: always() # 确保无论成功失败都执行
        with:
          retain_days: 2
          keep_minimum_runs: 3

      - name: 删除旧的 Release (保留最近10个)
        if: always() && env.UPLOAD_RELEASE == 'true' && (steps.compile.outputs.status == 'success' || steps.test_setup.outputs.status == 'success')
        uses: dev-drprasad/delete-older-releases@v0.3.1
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

